---
name: Verify tuple index diagnostics
on:
  push:
    branches: [validate-9915]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TESTS: TestEOtuple#can_reject_a_fractional_index_without_reading_the_tail+can_report_a_negative_fractional_index+can_report_a_nan_index+can_report_an_out_of_bounds_negative_index+can_report_a_negatively_infinite_index+can_report_a_fractional_index_coerced_from_bytes
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build the compiler dependencies
        run: mvn -ntp -B -PskipTests -pl :eo-maven-plugin -am install
      - name: Verify all tuple object tests with the corrected implementation
        run: |
          mvn -ntp -B -pl :eo-runtime -Deo.lower.bypass=true -Deo.transpile.coverage=false -Deo.deadline=30 -Deo.maxmem=2G '-Dtest=TestEOtuple' test
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          report = ET.parse(glob.glob('eo-runtime/target/surefire-reports/TEST-*TestEOtuple.xml')[0]).getroot()
          assert int(report.attrib['tests']) >= 6, report.attrib
          assert all(report.attrib[key] == '0' for key in ['failures', 'errors', 'skipped']), report.attrib
          print(report.attrib)
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: tuple-regression-results
          path: |
            before.log
            target/tuple-evidence/
            eo-runtime/target/surefire-reports/
