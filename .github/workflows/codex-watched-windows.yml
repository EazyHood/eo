name: Validate unchanged memory watcher on Windows
on:
  push:
    branches: [validate-8600-windows]
permissions:
  contents: read
jobs:
  watcher:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Copy the unchanged watcher and tests into an isolated test project
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'watcher/src/test/java/org/eolang'
          New-Item -ItemType Directory -Force $target | Out-Null
          foreach ($name in @('Watched', 'Consumed')) {
            Copy-Item "eo-runtime/src/main/java/org/eolang/$name.java" $target
          }
          Copy-Item 'eo-runtime/src/test/java/org/eolang/WatchedTest.java' $target
          foreach ($name in @('Watched', 'Consumed', 'WatchedTest')) {
            $kind = if ($name -eq 'WatchedTest') { 'test' } else { 'main' }
            $source = Get-FileHash "eo-runtime/src/$kind/java/org/eolang/$name.java"
            $copied = Get-FileHash "$target/$name.java"
            if ($source.Hash -ne $copied.Hash) { throw 'Source copy differs' }
          }
          @'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>validation</groupId><artifactId>watcher</artifactId><version>1</version>
            <properties><maven.compiler.release>17</maven.compiler.release></properties>
            <dependencies>
              <dependency><groupId>org.junit.jupiter</groupId><artifactId>junit-jupiter</artifactId><version>6.1.3</version><scope>test</scope></dependency>
              <dependency><groupId>org.hamcrest</groupId><artifactId>hamcrest</artifactId><version>3.0</version><scope>test</scope></dependency>
            </dependencies>
            <build><plugins>
              <plugin><groupId>org.apache.maven.plugins</groupId><artifactId>maven-compiler-plugin</artifactId><version>3.14.1</version></plugin>
              <plugin><groupId>org.apache.maven.plugins</groupId><artifactId>maven-surefire-plugin</artifactId><version>3.5.6</version></plugin>
            </plugins></build>
          </project>
          '@ | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/watcher/pom.xml"
      - name: Run all watcher tests and repeat the interrupted-watcher case
        shell: pwsh
        run: |
          mvn -ntp -B -f "$env:RUNNER_TEMP/watcher/pom.xml" test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          1..5 | ForEach-Object {
            mvn -ntp -B -f "$env:RUNNER_TEMP/watcher/pom.xml" '-Dtest=WatchedTest#stopsBodyWhenTheWatcherIsInterrupted' test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
