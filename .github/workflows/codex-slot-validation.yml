---
name: Verify slot errors
on:
  push:
    branches: [validate-9912]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TESTS: TestEOchunk#slot_stops_on_resizing_a_slot+slot_stops_on_taking_the_size_of_a_stale_slot+slot_stops_on_writing_past_the_slot_end
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile the unchanged implementation with the new tests
        run: |
          git diff 86626b4 fb15cb3 -- eo-runtime/src/main/eo/chunk/slot.eo | git apply -R
          mvn -ntp -B -PskipTests -Deo.lower.bypass=true -Deo.transpile.coverage=false -Deo.deadline=30 -Deo.maxmem=2G install
      - name: Confirm the three regressions fail before the fix
        run: |
          if mvn -ntp -B -pl :eo-runtime -Deo.lower.bypass=true -Deo.transpile.coverage=false -Deo.deadline=30 -Deo.maxmem=2G "-Dtest=$TESTS" test > before.log 2>&1; then
            cat before.log
            exit 1
          fi
          cat before.log
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          reports = glob.glob('eo-runtime/target/surefire-reports/TEST-*TestEOchunk.xml')
          assert len(reports) == 1, reports
          report = ET.parse(reports[0]).getroot()
          assert report.attrib['tests'] == '3', report.attrib
          assert report.attrib['failures'] == '3', report.attrib
          assert report.attrib['errors'] == '0', report.attrib
          assert report.attrib['skipped'] == '0', report.attrib
          PY
          mkdir -p target/slot-evidence/before
          cp eo-runtime/target/surefire-reports/TEST-*TestEOchunk.xml target/slot-evidence/before/
      - name: Confirm the same tests pass after the fix
        run: |
          git show HEAD:eo-runtime/src/main/eo/chunk/slot.eo > eo-runtime/src/main/eo/chunk/slot.eo
          mvn -ntp -B -pl :eo-runtime -Deo.lower.bypass=true -Deo.transpile.coverage=false -Deo.deadline=30 -Deo.maxmem=2G "-Dtest=$TESTS" test
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          report = ET.parse(glob.glob('eo-runtime/target/surefire-reports/TEST-*TestEOchunk.xml')[0]).getroot()
          assert report.attrib['tests'] == '3', report.attrib
          assert all(report.attrib[key] == '0' for key in ['failures', 'errors', 'skipped']), report.attrib
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: slot-regression-results
          path: |
            before.log
            target/slot-evidence/
            eo-runtime/target/surefire-reports/
