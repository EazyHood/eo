---
name: Verify slot errors
on:
  push:
    branches: [validate-9912]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TESTS: TestEOchunk#slot_stops_on_resizing_a_slot+slot_stops_on_taking_the_size_of_a_stale_slot+slot_stops_on_writing_past_the_slot_end
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build the compiler dependencies
        run: mvn -ntp -B -PskipTests -pl :eo-maven-plugin -am install
      - name: Verify all chunk object tests with the corrected implementation
        run: |
          mvn -ntp -B -pl :eo-runtime -Deo.lower.bypass=true -Deo.transpile.coverage=false -Deo.deadline=30 -Deo.maxmem=2G '-Dtest=TestEOchunk' test
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          report = ET.parse(glob.glob('eo-runtime/target/surefire-reports/TEST-*TestEOchunk.xml')[0]).getroot()
          assert int(report.attrib['tests']) >= 3, report.attrib
          assert all(report.attrib[key] == '0' for key in ['failures', 'errors', 'skipped']), report.attrib
          print(report.attrib)
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: slot-regression-results
          path: |
            before.log
            target/slot-evidence/
            eo-runtime/target/surefire-reports/
