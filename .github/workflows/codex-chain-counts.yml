name: Validate instance chain emission and counts
on:
  push:
    branches: [validate-8604-counts]
permissions:
  contents: read
jobs:
  parser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 10
      - name: Merge the candidate into the current upstream master
        run: |
          source=$(git rev-parse HEAD)
          git fetch --depth=10 https://github.com/objectionary/eo.git master
          git checkout --detach FETCH_HEAD
          git -c user.name='Codex validation' -c user.email='codex-validation@users.noreply.github.com' merge --no-ff --no-edit "${source}"
      - name: Run every count from the upstream workflow
        run: |
          head=$(git rev-parse HEAD)
          base=$(git rev-parse "${head}^1")
          metrics=${RUNNER_TEMP}/metrics.txt
          cat > "${metrics}" <<'EOF'
          suppressions *.java @SuppressWarnings
          checkstyles *.java @checkstyle
          statics *.java static
          instanceofs *.java instanceof
          nulls *.java null
          atoms *.java @XmirObject
          nodelists *.java org\.w3c\.dom\.NodeList
          unlints *.eo \+unlint
          negative-tests *.eo [ ]-->[ ]
          positive-tests *.eo [ ]\+\+>[ ]
          disabled *.java @Disabled\b
          EOF
          tally() {
            git checkout --quiet --force "$1"
            while read -r metric files pattern; do
              echo "${metric} $(( $(git ls-files -z -- "${files}" \
                | xargs -0 -r grep -Eoh -- "${pattern}" | wc -l) ))"
            done < "${metrics}"
          }
          tally "${base}" > "${RUNNER_TEMP}/master.txt"
          tally "${head}" > "${RUNNER_TEMP}/branch.txt"
          printf '%s\n' "base=${base}" "merge=${head}" > "${RUNNER_TEMP}/counts-heads.txt"
          awk 'NR==FNR {before[$1]=$2; next} {delta=$2-before[$1]; printf "%s %d %d %+d\n", $1,before[$1],$2,delta; if(delta>0) bad=1} END {exit bad}' "${RUNNER_TEMP}/master.txt" "${RUNNER_TEMP}/branch.txt" | tee "${RUNNER_TEMP}/counts-result.txt"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run explicit static quality checks
        run: mvn -ntp -B -Pqulice -Deo.skip -pl :eo-parser,:eo-printer -am clean process-classes qulice:check
      - name: Build and test the parser and printer with quality checks
        run: mvn -ntp -B -Pqulice -pl :eo-parser,:eo-printer -am clean install
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: chain-emission-counts-and-tests
          path: |
            ${{ runner.temp }}/counts-heads.txt
            ${{ runner.temp }}/counts-result.txt
            ${{ runner.temp }}/master.txt
            ${{ runner.temp }}/branch.txt
            eo-parser/target/surefire-reports
            eo-printer/target/surefire-reports
