name: Validate dispatch refactoring
on:
  push:
    branches: [validate-8600]
permissions:
  contents: read
jobs:
  parser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test the parser with quality checks
        run: mvn -ntp -B -Pqulice -pl :eo-parser -am clean install
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: parser-test-results
          path: eo-parser/target/surefire-reports
