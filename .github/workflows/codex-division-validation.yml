---
name: Verify division diagnostics
on:
  push:
    branches: [validate-9913]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TESTS: TestEOi64#div_can_report_division_by_zero_*,TestEOu64#div_can_report_division_by_zero_*
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile original implementation with new regression tests
        run: |
          git diff ff22a7d 1d2c1dd -- eo-runtime/src/main/eo/i64/div.eo eo-runtime/src/main/eo/u64/div.eo | git apply -R
          mvn -ntp -B -PskipTests -Deo.lower.bypass=true -Deo.transpile.coverage=false -Deo.deadline=30 -Deo.maxmem=2G install
      - name: Verify original diagnostics fail all six regressions
        run: |
          if mvn -ntp -B -pl :eo-runtime -Deo.lower.bypass=true -Deo.transpile.coverage=false -Deo.deadline=30 -Deo.maxmem=2G "-Dtest=$TESTS" test > before.log 2>&1; then
            cat before.log
            exit 1
          fi
          cat before.log
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          reports = [ET.parse(p).getroot() for p in glob.glob('eo-runtime/target/surefire-reports/TEST-*TestEO*64.xml')]
          assert sum(int(r.attrib['tests']) for r in reports) == 6, [r.attrib for r in reports]
          assert sum(int(r.attrib['failures'])+int(r.attrib['errors']) for r in reports) == 6, [r.attrib for r in reports]
          assert sum(int(r.attrib['skipped']) for r in reports) == 0
          PY
          mkdir -p target/division-evidence/before
          cp eo-runtime/target/surefire-reports/TEST-*TestEO*64.xml target/division-evidence/before/
      - name: Verify corrected diagnostics and integer object tests
        run: |
          git restore --source=HEAD -- eo-runtime/src/main/eo/i64/div.eo eo-runtime/src/main/eo/u64/div.eo
          mvn -ntp -B -pl :eo-runtime -Deo.lower.bypass=true -Deo.transpile.coverage=false -Deo.deadline=30 -Deo.maxmem=2G '-Dtest=TestEOi64,TestEOu64' test
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: division-regression-results
          path: |
            before.log
            target/division-evidence/
            eo-runtime/target/surefire-reports/
