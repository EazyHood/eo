---
name: Verify placement performance
on:
  push:
    branches: [validate-8579]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile the original plugin and benchmark harness
        run: |
          git restore --source=d60768c -- eo-maven-plugin/src/main/java/org/eolang/maven/Placing.java eo-maven-plugin/src/main/java/org/eolang/maven/Unplacing.java
          mvn -ntp -B -PskipTests -pl :eo-maven-plugin -am install
          mvn -ntp -B -pl :eo-maven-plugin dependency:build-classpath -Dmdep.outputFile=target/placement-classpath.txt -DincludeScope=test
          mkdir -p "$RUNNER_TEMP/benchmark"
          javac -cp "eo-maven-plugin/target/classes:$(cat eo-maven-plugin/target/placement-classpath.txt)" -d "$RUNNER_TEMP/benchmark" .github/validation/PlacementBenchmark.java
      - name: Measure original placement and unplacement
        run: java -cp "$RUNNER_TEMP/benchmark:eo-maven-plugin/target/classes:$(cat eo-maven-plugin/target/placement-classpath.txt)" org.eolang.maven.PlacementBenchmark | tee placement-before.log
      - name: Validate corrected plugin through place and unplace entry points
        run: |
          git restore --source=HEAD -- eo-maven-plugin/src/main/java/org/eolang/maven/Placing.java eo-maven-plugin/src/main/java/org/eolang/maven/Unplacing.java
          mvn -ntp -B -Pqulice -pl :eo-maven-plugin '-Dtest=MjPlaceTest,MjUnplaceTest,UnplacingTest,PlaceTest,UnplaceTest' test
      - name: Measure corrected placement and unplacement
        run: java -cp "$RUNNER_TEMP/benchmark:eo-maven-plugin/target/classes:$(cat eo-maven-plugin/target/placement-classpath.txt)" org.eolang.maven.PlacementBenchmark | tee placement-after.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: placement-validation
          path: |
            placement-before.log
            placement-after.log
            eo-maven-plugin/target/surefire-reports/
