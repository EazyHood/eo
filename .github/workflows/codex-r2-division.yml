---
name: Verify division tests without message checks
on:
  push:
    branches: [validate-9913-r2]
permissions:
  contents: read
jobs:
  division:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build the compiler dependencies
        run: mvn -ntp -B -PskipTests -pl :eo-maven-plugin -am install
      - name: Run the i64 and u64 object tests
        run: mvn -ntp -B -pl :eo-runtime -Deo.lower.bypass=true -Deo.transpile.coverage=false -Deo.deadline=30 -Deo.maxmem=2G '-Dtest=TestEOi64,TestEOu64' test
      - name: Check that every test passes and none reads the diagnostic
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          paths = glob.glob('eo-runtime/target/surefire-reports/TEST-*TestEO*64.xml')
          assert paths
          for path in paths:
              root = ET.parse(path).getroot()
              print(path, root.attrib)
              assert all(root.attrib[k] == '0' for k in ['failures', 'errors', 'skipped']), root.attrib
              names = [c.attrib['name'] for c in root.iter('testcase')]
              assert not [n for n in names if 'can_report_division_by_zero' in n], names
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: division-${{ github.ref_name }}
          path: eo-runtime/target/surefire-reports/
