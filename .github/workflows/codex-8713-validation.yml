name: Validate parser change 8713
on:
  push:
    branches: [validate-8713]
permissions:
  contents: read
jobs:
  parser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run explicit static quality checks
        run: mvn -ntp -B -Pqulice -Deo.skip -pl :eo-printer -am clean process-classes qulice:check
      - name: Build and test with quality checks
        run: mvn -ntp -B -Pqulice -pl :eo-printer -am clean install
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results-8713
          path: |
            eo-parser/target/surefire-reports
            eo-printer/target/surefire-reports
