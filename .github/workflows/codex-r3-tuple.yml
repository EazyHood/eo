---
name: Verify tuple diagnostics for huge indexes
on:
  push:
    branches: [validate-9915-r3, validate-9915-r3-old]
permissions:
  contents: read
jobs:
  tuple:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build the compiler dependencies
        run: mvn -ntp -B -PskipTests -pl :eo-maven-plugin -am install
      - name: Run every tuple object test
        run: |
          mvn -ntp -B -pl :eo-runtime -Deo.lower.bypass=true -Deo.transpile.coverage=false -Deo.deadline=30 -Deo.maxmem=2G '-Dtest=TestEOtuple' test > tuple.log 2>&1 || true
          tail -n 80 tuple.log
      - name: Check the expected outcome for this branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          root = ET.parse(glob.glob('eo-runtime/target/surefire-reports/TEST-*TestEOtuple.xml')[0]).getroot()
          print(root.attrib)
          huge = 'can_name_a_huge_index_in_the_message'
          names = [c.attrib['name'] for c in root.iter('testcase')]
          assert any(huge in n for n in names), names
          bad = {}
          for c in root.iter('testcase'):
              for kind in ('failure', 'error'):
                  node = c.find(kind)
                  if node is not None:
                      bad[c.attrib['name']] = (kind, (node.get('message') or '')[:300])
          print('not passing:', bad)
          assert int(root.attrib['skipped']) == 0, root.attrib
          if os.environ['BRANCH'].endswith('-old'):
              assert list(bad) and all(huge in n for n in bad), bad
          else:
              assert not bad, bad
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: tuple-${{ github.ref_name }}
          path: |
            tuple.log
            eo-runtime/target/surefire-reports/
