name: Validate placement quality
on:
  push:
    branches: [validate-8579-quality]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run quality checks
        run: mvn -ntp -B -Pqulice -Deo.skip -pl :eo-maven-plugin -am clean process-classes qulice:check
      - name: Run placement regressions
        run: mvn -ntp -B -pl :eo-maven-plugin '-Dtest=MjPlaceTest,MjUnplaceTest,UnplacingTest,PlaceTest,UnplaceTest' test
