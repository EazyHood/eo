---
name: Verify tuple tests without message checks
on:
  push:
    branches: [validate-9915-r2, validate-9915-r2-base]
permissions:
  contents: read
jobs:
  tuple:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build the compiler dependencies
        run: mvn -ntp -B -PskipTests -pl :eo-maven-plugin -am install
      - name: Run every tuple object test
        run: |
          mvn -ntp -B -pl :eo-runtime -Deo.lower.bypass=true -Deo.transpile.coverage=false -Deo.deadline=30 -Deo.maxmem=2G '-Dtest=TestEOtuple' test > tuple.log 2>&1 || true
          tail -n 80 tuple.log
      - name: Check the expected outcome for this branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          root = ET.parse(glob.glob('eo-runtime/target/surefire-reports/TEST-*TestEOtuple.xml')[0]).getroot()
          print(root.attrib)
          names = [c.attrib['name'] for c in root.iter('testcase')]
          bad = [
              c.attrib['name'] for c in root.iter('testcase')
              if c.find('failure') is not None or c.find('error') is not None
          ]
          print('not passing:', bad)
          tail = 'can_reject_a_fractional_index_without_reading_the_tail'
          assert any(tail in n for n in names), names
          assert int(root.attrib['skipped']) == 0, root.attrib
          if os.environ['BRANCH'].endswith('-base'):
              assert bad and all(tail in n for n in bad), bad
          else:
              assert not bad, bad
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: tuple-${{ github.ref_name }}
          path: |
            tuple.log
            eo-runtime/target/surefire-reports/
